syntax = "proto3";

package activity_tree;

import "protos/activity.proto";

// ActivityNode represents aggregated activity data
message ActivityNode {
    uint64 put_count = 1;
    uint64 get_count = 2;
    int64 stored = 3;
    uint64 transferred = 4;
    uint64 cpu_units = 5;
    uint64 gpu_units = 6;
    uint64 ram_units = 7;
    uint64 compute_count = 8;
}

// NodeTreeLeaf represents a leaf in the node aggregation merkle tree
message NodeTreeLeaf {
    uint64 bucket_id = 1;
    bytes record_id = 2;
    activity.ActivityRequest.RequestType request_type = 3;
    int64 stored = 4;
    uint64 transferred = 5;
    uint64 cpu_units = 6;
    uint64 gpu_units = 7;
    uint64 ram_units = 8;
}

// BucketSubTreeLeaf represents a leaf in the bucket sub-tree (per-node within bucket)
message BucketSubTreeLeaf {
    bytes record_id = 1;
    activity.ActivityRequest.RequestType request_type = 2;
    int64 stored = 3;
    uint64 transferred = 4;
    uint64 cpu_units = 5;
    uint64 gpu_units = 6;
    uint64 ram_units = 7;
}

// TcaBucketAggregate represents a bucket's aggregated data within a TCA
message TcaBucketAggregate {
    uint64 bucket_id = 1;
    ActivityNode activity_node = 2;
    bytes root_hash = 3;
}

// TcaNodeAggregate represents a node's aggregated data within a TCA
message TcaNodeAggregate {
    bytes node_key = 1; // node public key (32 bytes)
    ActivityNode activity_node = 2;
    bytes root_hash = 3;
}

// TcaPayload represents all aggregated data for a specific TCA
// This is a self-contained structure for passing TCA data to WASM functions
message TcaPayload {
    uint32 tca_id = 1;
    repeated TcaBucketAggregate bucket_aggregates = 2;
    repeated TcaNodeAggregate node_aggregates = 3;
}

// PhdPayload represents PHD data from a single collector
message PhdPayload {
    bytes node_key = 1;      // Collector's node key (32 bytes)
    bytes provider_id = 2;   // Provider ID for this collector (32 bytes)
    PhdTreeNode phd_data = 3; // PHD tree node data
}

// EhdPayload represents all data needed for EHD era processing
message EhdPayload {
    uint32 era_id = 1;
    repeated PhdPayload collector_phds = 2;
}

// EhdTreeNodeCustomerAggregate represents customer aggregate in EHD tree node
message EhdTreeNodeCustomerAggregate {
    bytes customer_id = 1;      // Customer ID (32 bytes)
    ActivityNode consumed_usage = 2;
}

// EhdTreeNodeProviderNodeAggregate represents node aggregate within provider in EHD tree node
message EhdTreeNodeProviderNodeAggregate {
    bytes node_id = 1;          // Node ID (32 bytes)
    ActivityNode activity_node = 2;
}

// EhdTreeNodeProviderAggregate represents provider aggregate in EHD tree node
message EhdTreeNodeProviderAggregate {
    bytes provider_id = 1;      // Provider ID (32 bytes)
    ActivityNode provided_usage = 2;
    repeated EhdTreeNodeProviderNodeAggregate nodes = 3;
}

// EhdTreeNode represents the aggregated node content for EHD merkletree
message EhdTreeNode {
    repeated string phd_ids = 1;
    repeated EhdTreeNodeCustomerAggregate customers = 2;
    repeated EhdTreeNodeProviderAggregate providers = 3;
}

// EhdTreeTraversedNode represents a traversed node in the EHD tree
message EhdTreeTraversedNode {
    string ehd_id = 1;
    bytes grouping_collector = 2;   // 32 bytes public key
    uint64 merkle_tree_node_id = 3;
    bytes merkle_tree_node_hash = 4;
    repeated string phd_ids = 5;
    string status = 6;
    repeated EhdTreeNodeCustomerAggregate customers = 7;
    repeated EhdTreeNodeProviderAggregate providers = 8;
}

// EhdTreeTraversalResponse represents the response from EHD tree traversal endpoint
message EhdTreeTraversalResponse {
    repeated EhdTreeTraversedNode nodes = 1;
}

// PhdTcaAggregate represents TCA-level aggregate data for PHD
message PhdTcaAggregate {
    uint32 tca_id = 1;
    bytes tca_root_hash = 2;
    ActivityNode activity_node = 3;
}

// PhdBucketAggregateGroup represents a group of TCA aggregates for a bucket
message PhdBucketAggregateGroup {
    uint64 bucket_id = 1;
    repeated PhdTcaAggregate aggregates = 2;
}

// PhdNodeAggregateGroup represents a group of TCA aggregates for a node
message PhdNodeAggregateGroup {
    bytes node_key = 1; // node public key (32 bytes)
    repeated PhdTcaAggregate aggregates = 2;
}

// PhdTreeNode represents the aggregated node content for PHD merkletree
message PhdTreeNode {
    repeated PhdBucketAggregateGroup bucket_aggregates = 1;
    repeated PhdNodeAggregateGroup nodes_aggregates = 2;
}

// PhdTreeTraversedNode represents a traversed node in the PHD tree
message PhdTreeTraversedNode {
    string phd_id = 1;
    bytes collector_id = 2;         // 32 bytes public key
    uint64 merkle_tree_node_id = 3;
    bytes merkle_tree_node_hash = 4;
    repeated PhdBucketAggregateGroup bucket_aggregates = 5;
    repeated PhdNodeAggregateGroup nodes_aggregates = 6;
}

// PhdTreeTraversalResponse represents the response from PHD tree traversal endpoint
message PhdTreeTraversalResponse {
    repeated PhdTreeTraversedNode nodes = 1;
}

// BucketSubAggregate represents sub-aggregate data for a bucket per node
message BucketSubAggregate {
    bytes node_key = 1;
    ActivityNode activity = 2;
}

// BucketAggregate represents aggregated activity data for a bucket
message BucketAggregate {
    uint64 bucket_id = 1;
    ActivityNode activity = 2;
    repeated BucketSubAggregate sub_aggregates = 3;
}

// BucketAggregatesResponse represents the response from bucket aggregates endpoint
message BucketAggregatesResponse {
    repeated BucketAggregate buckets = 1;
}

// ActivityTreeTraversedNode represents a traversed node in activity tree (node or bucket sub-tree)
message ActivityTreeTraversedNode {
    uint64 merkle_tree_node_id = 1;
    bytes hash = 2;
    ActivityNode activity = 3;
}

// ActivityTreeTraversalResponse represents the response from activity tree traversal endpoint
message ActivityTreeTraversalResponse {
    repeated ActivityTreeTraversedNode nodes = 1;
}

