syntax = "proto3";

package inspection_sync;

// ============================================================================
// Inspection Sync Quorum - Protocol Buffer Definitions
// ============================================================================
// This file defines all data structures for the etcd-based sync quorum
// that provides shared memory coordination for inspectors running in OCW.
//
// Version: 2.0.0 (Protobuf Migration)
// Origin: ddc-node/pb/inspection_sync.proto (Go implementation)
// ============================================================================

// ============================================================================
// Core Enums
// ============================================================================

enum LeaseStatus {
  LEASE_STATUS_UNSPECIFIED = 0;
  LEASE_STATUS_ACQUIRED = 1;
  LEASE_STATUS_HELD_BY_OTHER = 2;
  LEASE_STATUS_ERROR = 3;
}

enum InspectionPathStatusEnum {
  INSPECTION_PATH_STATUS_UNSPECIFIED = 0;
  INSPECTION_PATH_STATUS_PENDING = 1;
  INSPECTION_PATH_STATUS_IRF_REACHED = 2;
  INSPECTION_PATH_STATUS_IRF_UNREACHED = 3;
}

enum ArchivalStatus {
  ARCHIVAL_STATUS_UNSPECIFIED = 0;
  ARCHIVAL_STATUS_PENDING = 1;
  ARCHIVAL_STATUS_IN_PROGRESS = 2;
  ARCHIVAL_STATUS_COMPLETE = 3;
  ARCHIVAL_STATUS_FAILED = 4;
}

enum GetAssignmentTableStatus {
  GET_ASSIGNMENT_TABLE_STATUS_UNSPECIFIED = 0;
  GET_ASSIGNMENT_TABLE_STATUS_FOUND = 1;
  GET_ASSIGNMENT_TABLE_STATUS_NOT_FOUND = 2;
  GET_ASSIGNMENT_TABLE_STATUS_BUILDING = 3;
}

enum PostAssignmentTableStatus {
  POST_ASSIGNMENT_TABLE_STATUS_UNSPECIFIED = 0;
  POST_ASSIGNMENT_TABLE_STATUS_ACCEPTED = 1;
  POST_ASSIGNMENT_TABLE_STATUS_REJECTED = 2;
}

enum PostInspectionResultStatus {
  POST_INSPECTION_RESULT_STATUS_UNSPECIFIED = 0;
  POST_INSPECTION_RESULT_STATUS_ACCEPTED = 1;
  POST_INSPECTION_RESULT_STATUS_PARTIAL = 2;
  POST_INSPECTION_RESULT_STATUS_REJECTED = 3;
}

// ============================================================================
// Lease Management (POST /itm/lease)
// ============================================================================

message LeaseRequest {
  uint32 era_id = 1;
  string inspector_key = 2;  // Public key of inspector's task manager
  int64 ttl_seconds = 3;      // Lease time-to-live
}

message LeaseResult {
  LeaseStatus status = 1;
  uint32 era_id = 2;
  string inspector_key = 3;
  string lease_id = 4;
  int64 expires_at = 5;       // Unix timestamp
  string current_holder = 6;  // Populated if status == HELD_BY_OTHER
  string error_message = 7;   // Populated if status == ERROR
}

// ============================================================================
// Assignment Table (POST /itm/submit, GET /itm/table)
// ============================================================================

message PostAssignmentTableRequest {
  uint32 era_id = 1;
  string inspector_key = 2;
  AssignmentTable table = 3;
}

message PostAssignmentTableResponse {
  PostAssignmentTableStatus status = 1;
  uint32 era_id = 2;
  int64 submitted_at = 3;      // Unix timestamp
  string error_code = 4;       // Populated if status == REJECTED
  string error_message = 5;    // Populated if status == REJECTED
}

message AssignmentTable {
  string cluster_id = 1;       // 0x-hex encoded ClusterId
  uint32 era = 2;
  uint32 irf = 3;  // Inspection Redundancy Factor
  map<string, InspectionPath> paths = 4;          // path_hash (hex string) -> InspectionPath
  map<string, InspectorAssignments> assignments = 5;  // path_hash (hex string) -> assignments
  uint64 collective_seed = 6;  // From multi-party commitment (salts from inspectors)
  string builder = 7;          // Inspector's task manager that built the table
  int64 submitted_at = 8;      // Unix timestamp

  // Archival metadata (managed by system during archival to DDC cluster)
  bytes archived_cid = 9;
  int64 archived_at = 10;
  ArchivalStatus archival_status = 11;
}

enum InspectionPathType {
  INSPECTION_PATH_TYPE_UNSPECIFIED = 0;
  INSPECTION_PATH_TYPE_NODE_AR = 1;
  INSPECTION_PATH_TYPE_BUCKET_AR = 2;
}

message NodeARPath {
  string node_key = 1;             // Data node being inspected (0x-hex encoded NodePubKey)
  repeated uint64 leaves_ids = 2;  // Merkle tree leaf IDs in NodeAggregate tree
  uint32 tca_id = 3;               // Time capsule era (specific to NodeAR inspection)
}

message BucketARPath {
  uint64 bucket_id = 1;            // Bucket being inspected
  repeated uint64 leaves_pos = 2;  // Merkle tree leaf positions in BucketAggregate tree
  uint32 tca_id = 3;               // Time capsule era (specific to BucketAR inspection)
}

// TODO: Consider embedding cumulative TCA usage (bytes cumulative_usage) directly
// into InspectionPath or NodeARPath/BucketARPath. This would let payouts access
// usage data for quorum-unreached paths without re-fetching from TCA endpoints,
// and simplify exception building by making usage available at path construction time.
// Trade-off: increases assignment table size for all paths.
message InspectionPath {
  InspectionPathType path_type = 1;        // NodeAR or BucketAR
  repeated string collectors = 2;          // 0x-hex encoded collector node keys
  oneof path_data {
    NodeARPath node_ar = 3;
    BucketARPath bucket_ar = 4;
  }
}

message InspectorAssignments {
  repeated string main_inspectors = 1;   // First IRF inspectors (start immediately)
  repeated string backup_inspectors = 2; // Backup inspectors (delayed start)
}

message GetAssignmentTableResponse {
  GetAssignmentTableStatus status = 1;
  uint32 era_id = 2;
  AssignmentTable table = 3;       // Populated if status == FOUND
  string lease_holder = 4;         // Populated if status == BUILDING
  int64 lease_expires_at = 5;      // Populated if status == BUILDING
}

// ============================================================================
// Path Receipts & State (POST /itm/path, GET /itm/state)
// ============================================================================

message PostInspectionResultRequest {
  uint32 era_id = 1;
  string inspector_key = 2;
  repeated InspectionPathResult paths_results = 3;
}

message Provenance {
  string collector_key = 1;        // 0x-hex encoded collector node public key
  bytes response_signature = 2;    // Collector's signature over the challenge response
}

message UnverifiedUsage {
  bytes usage = 1;                 // Protobuf-encoded ActivityNode
  Provenance source_collector = 2; // Collector that provided the usage data
}

message InspectionPathResult {
  string path_hash = 1;            // 0x-hex encoded Blake2b-256 path hash
  string result_hash = 2;          // 0x-hex encoded result hash
  optional bytes exception = 3;    // Fraud evidence; absent = path verified/approved
  repeated Provenance source_collectors = 4;
}

message PostInspectionResultResponse {
  PostInspectionResultStatus status = 1;
  int32 accepted_count = 2;
  int32 rejected_count = 3;
  repeated string quorum_reached_paths = 4;  // Path hashes that reached IRF quorum
  repeated RejectedInspectionPath rejected_paths = 5;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_DUPLICATE = 1;
  REJECTION_REASON_NOT_ASSIGNED = 2;
  REJECTION_REASON_INVALID_PATH = 3;
}

message RejectedInspectionPath {
  string path_hash = 1;           // 0x-hex encoded Blake2b-256 path hash
  RejectionReason reason = 2;
}

message InspectionState {
  uint32 era_id = 1;
  uint32 irf = 2;                 // Inspection Redundancy Factor (from AssignmentTable)
  int32 total_paths = 3;
  int32 verified_paths = 4;       // Quorum reached, no exception
  int32 unverified_paths = 5;     // Quorum reached, with exception
  int32 pending_paths = 6;        // Still waiting for quorum
  map<string, InspectionPathStatus> paths = 7;  // path_hash (hex string) -> status

  // Archival metadata
  int64 updated_at = 8;           // Unix timestamp
  bytes archived_cid = 9;
  int64 archived_at = 10;
  ArchivalStatus archival_status = 11;
}

message InspectionPathStatus {
  InspectionPathStatusEnum status = 1;
  string result_hash = 2;                      // 0x-hex encoded winning hash (if quorum reached)
  bytes exception = 3;                         // Protobuf-encoded InspPathException; absent = path verified/approved
  map<string, int32> submissions = 4;          // hash (hex string) -> inspector count
  repeated string inspectors = 5;              // Inspectors who already submitted
  repeated string remaining_inspectors = 6;    // Assigned inspectors who haven't submitted yet
}

// ============================================================================
// Inspection Receipt (GET /itm/summary)
// ============================================================================

message InspectionReceipt {
  uint32 era_id = 1;
  string cluster_id = 2;                           // 0x-hex encoded ClusterId
  bool complete = 3;
  repeated string verified_paths = 4;              // 0x-hex encoded path hashes
  repeated UnverifiedPath unverified_paths = 5;
  repeated string quorum_unreached_paths = 6;      // 0x-hex encoded path hashes

  // Archival metadata
  int64 generated_at = 7;         // Unix timestamp
  bytes archived_cid = 8;
  int64 archived_at = 9;
  ArchivalStatus archival_status = 10;
}

message UnverifiedPath {
  string path_hash = 1;            // 0x-hex encoded Blake2b-256 path hash
  bytes exception = 2;             // Protobuf-encoded InspPathException
}

message InspPathException {
  oneof kind {
    MultipleExceptions multiple_exceptions = 1;
    NodeARsSigUnverified node_ars_sig_unverified = 2;
    BucketARsSigUnverified bucket_ars_sig_unverified = 3;
    NodeARsUnavailable node_ars_unavailable = 4;
    BucketARsUnavailable bucket_ars_unavailable = 5;
    NodeAggregateMalformed node_aggregate_malformed = 6;
    BucketAggregateMalformed bucket_aggregate_malformed = 7;
    NodeTCAUsageUnavailable node_tca_usage_unavailable = 8;
    BucketTCAUsageUnavailable bucket_tca_usage_unavailable = 9;
  }
}

message MultipleExceptions {
  repeated InspPathException exceptions = 1;
}

message NodeARsSigUnverified {
  string node_key = 1;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 2;
  repeated uint64 bad_leaves_ids = 3;
  UnverifiedUsage unverified_usage = 4;
}

message BucketARsSigUnverified {
  uint64 bucket_id = 1;
  string node_key = 2;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 3;
  repeated uint64 bad_leaves_ids = 4;
  UnverifiedUsage unverified_usage = 5;
}

message NodeARsUnavailable {
  string node_key = 1;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 2;
  repeated uint64 leaves_ids = 3;
  UnverifiedUsage unverified_usage = 4;
}

message BucketARsUnavailable {
  uint64 bucket_id = 1;
  string node_key = 2;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 3;
  repeated uint64 leaves_ids = 4;
  UnverifiedUsage unverified_usage = 5;
}

message NodeAggregateMalformed {
  string node_key = 1;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 2;
  UnverifiedUsage unverified_usage = 3;
}

message BucketAggregateMalformed {
  uint64 bucket_id = 1;
  uint32 tca_id = 2;
  UnverifiedUsage unverified_usage = 3;
}

message NodeTCAUsageUnavailable {
  string node_key = 1;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 2;
  UnverifiedUsage accessible_usage = 3;
}

message BucketTCAUsageUnavailable {
  uint64 bucket_id = 1;
  string node_key = 2;            // 0x-hex encoded NodePubKey
  uint32 tca_id = 3;
  UnverifiedUsage accessible_usage = 4;
}

// ============================================================================
// Quorum Discovery (GET /itm/quorum)
// ============================================================================

message InspSyncQuorumInfo {
  uint32 era_id = 1;
  repeated InspSyncQuorumMember quorum_members = 2;
  int32 quorum_size = 3;
  int32 healthy_members = 4;
  bytes election_seed = 5;
  int64 formation_time = 6;      // Unix timestamp
  string single_endpoint = 7;    // Populated if mode == SINGLE (not used in this version)
}

message InspSyncQuorumMember {
  string node_key = 1;
  string http_endpoint = 2;
  string etcd_client_url = 3;
  bool is_leader = 4;
  bool is_healthy = 5;
}

// ============================================================================
// Error Handling
// ============================================================================

message ErrorResponse {
  string error_code = 1;
  string error_message = 2;
  map<string, string> details = 3;
}

message StateError {
  string status = 1;  // "not_found"
  uint32 era_id = 2;
  string message = 3;
}
