name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - master
  push:
    branches:
      - dev

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Only when the secret exists; public deps resolve without it.
      - name: Configure git authentication
        run: |
          if [ -n "$GH_READ_TOKEN" ]; then
            git config --global url."https://${GH_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}

      - name: Install protoc
        run: |
          PROTOC_VERSION="29.3"
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o "protoc-${PROTOC_VERSION}-linux-x86_64.zip" -d /usr/local
          protoc --version

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.91.0'
          components: clippy, rustfmt
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Build
        run: cargo build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      - name: Run tests
        run: cargo test
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      # The runtime consumes this crate without std.
      - name: Check no_std build
        run: cargo check --no-default-features --target wasm32-unknown-unknown
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
